name: CI/CD Pipeline

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: perera1325/self-healing-platform
  AWS_REGION: eu-north-1
  EKS_CLUSTER_NAME: devops-cluster
  AWS_ROLE_ARN: arn:aws:iam::127730655048:role/GitHubActions-EKS-Deploy

jobs:

  # ==========================================
  # BUILD AND PUSH DOCKER IMAGE
  # ==========================================
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}


  # ==========================================
  # DEPLOY TO EKS
  # ==========================================
  deploy:
    name: Deploy to EKS
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read
      id-token: write

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4


      # ======================================
      # AUTHENTICATE TO AWS USING OIDC
      # ======================================
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      # ======================================
      # CHECK AWS IDENTITY
      # ======================================
      - name: Check AWS Identity
        run: |
          aws sts get-caller-identity


      # ======================================
      # UPDATE KUBECONFIG
      # ======================================
      - name: Update Kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name ${{ env.EKS_CLUSTER_NAME }} \
            --region ${{ env.AWS_REGION }}


      # ======================================
      # CHECK EKS ACCESS
      # ======================================
      - name: Check Kubernetes Access
        run: |
          kubectl get nodes
          kubectl get pods -n default


      # ======================================
      # CREATE GHCR LOGIN SECRET
      # ======================================
      - name: Create GHCR Login Secret
        run: |
          kubectl create secret docker-registry ghcr-login \
            --docker-server=${{ env.REGISTRY }} \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GITHUB_TOKEN }} \
            --namespace default \
            --dry-run=client \
            -o yaml | kubectl apply -f -


      # ======================================
      # DEPLOY KUBERNETES MANIFESTS
      # ======================================
      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/
          kubectl apply -f monitoring/


      # ======================================
      # UPDATE IMAGE
      # ======================================
      - name: Update Deployment Image
        run: |
          kubectl set image deployment/nginx-deployment \
            nginx=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -n default


      # ======================================
      # WAIT FOR ROLLOUT
      # ======================================
      - name: Monitor Rollout
        run: |
          kubectl rollout status deployment/nginx-deployment \
            -n default \
            --timeout=5m


      # ======================================
      # SHOW FINAL STATUS
      # ======================================
      - name: Verify Deployment
        run: |
          kubectl get deployments -n default
          kubectl get pods -n default
          kubectl get svc -n default
